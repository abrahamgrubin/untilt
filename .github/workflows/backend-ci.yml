name: Backend CI

# Typecheck and test only. Render deploys main itself (render.yaml,
# autoDeploy: true) — see docs/adr/0004-leave-aws.md.
on:
  push:
    branches: [main]
    paths:
      - "Server/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "Server/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
